[package]
name = "isecure-rust-client"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Transport-neutral Rust SDK for ISECure REST API v2"
license = "Unlicense"
repository = "https://github.com/isecurefi/isecure-rust-client"
keywords = ["isecure", "banking", "rest", "wasm"]
categories = ["api-bindings", "web-programming::http-client"]
publish = false
readme = "README.md"

[features]
default = ["std"]
std = [
    "base64/std",
    "rand_core/std",
    "rsa/std",
    "serde/std",
    "serde_json/std",
    "sha1/std",
    "sha2/std",
    "zeroize/std",
]

[lib]
name = "isecure_rust_client"
path = "src/lib.rs"

[dependencies]
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
rand_core = { version = "=0.6.4", default-features = false }
rsa = { version = "=0.9.10", default-features = false, features = ["pem"] }
serde = { version = "=1.0.229", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["oid"] }
sha1 = { version = "=0.10.7", default-features = false, features = ["oid"] }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
futures-executor = "=0.3.34"
rand_chacha = "=0.3.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
